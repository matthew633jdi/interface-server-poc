spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms # 첫 재시도까지 대기 시간 (2초)
          max-attempts: 3           # 최대 시도 횟수
          multiplier: 2.0           # 실패할 때마다 대기 시간 2배씩 증가
        acknowledge-mode: auto      # 예외 발생 시 자동으로 NACK 처리
        default-requeue-rejected: false # 재시도 횟수 초과 시 다시 큐에 넣지 않고 버림(설정한 DLX로 이동하게 함)

hl7:
  server:
    port: ${HL7_SERVER_PORT:2575}
  rabbitmq:
    exchange: ${HL7_EXCHANGE:hl7.inbound.exchange}
    queue: ${HL7_QUEUE:hl7.inbound.queue}
    routing-key: ${HL7_ROUTING_KEY:hl7.inbound.raw}
    dlq-name: ${HL7_DLQ:hl7.inbound.dlq}
    dlx-name: ${HL7_DLX:hl7.inbound.dlx}
    dlq-routing-key: ${HL7_DQL_ROUTING_KEY:hl7.dead.letter}